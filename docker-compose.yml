services:
  # Database PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: kas_postgres
    restart: always
    environment:
      POSTGRES_DB: kas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kas_net

  # Redis Cache & Session Token Store
  redis:
    image: redis:7-alpine
    container_name: kas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kas_net

  # Apache Kafka in KRaft mode (No Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kas_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kas_net

  # Microservice Common (Quarkus)
  common:
    image: common-common:latest
    container_name: kas_common_service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kas_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      REDIS_HOST: redis://redis:6379
      QUARKUS_REDIS_HOSTS: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kas_net

  # Kong API Gateway (DB-less mode)
  kong:
    image: kong:3.7
    container_name: kas_kong_gateway
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"   # Kong HTTP Proxy
      - "8443:8443"   # Kong HTTPS Proxy
      - "8001:8001"   # Kong Admin API
    depends_on:
      - common
      - pos
      - dcms
      - logging
      - master
    networks:
      - kas_net

  # Standalone Master Data Management & Theming Microservice (Quarkus)
  master:
    image: common-master:latest
    container_name: kas_master_service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m"
      DB_URL: jdbc:postgresql://postgres:5432/kas_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kas_net

  # Standalone POS & Retail Store Microservice (Quarkus)
  pos:
    image: common-pos:latest
    container_name: kas_pos_service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m"
      DB_URL: jdbc:postgresql://postgres:5432/kas_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      COMMON_SERVICE_URL: http://common:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kas_net

  # Standalone DCMS & Notification Microservice (Quarkus)
  dcms:
    image: common-dcms:latest
    container_name: kas_dcms_service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m"
      DB_URL: jdbc:postgresql://postgres:5432/kas_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      DCMS_STORAGE_DIR: /app/storage/uploads
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - dcms_uploads:/app/storage/uploads
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kas_net

  # Standalone Centralized Logging & Audit Microservice (Quarkus)
  logging:
    image: common-logging:latest
    container_name: kas_logging_service
    restart: always
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m"
      DB_URL: jdbc:postgresql://postgres:5432/kas_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - kas_net

  # Frontend POS & Management UI (React 19 + Vite + Nginx)
  ui:
    image: common-ui:latest
    container_name: kas_pos_ui
    restart: always
    ports:
      - "80:3000"
      - "3000:3000"
    depends_on:
      - kong
    networks:
      - kas_net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  dcms_uploads:

networks:
  kas_net:
    driver: bridge
